# Generated by platform bootstrap — do not edit manually
http:
  routers:
    portal:
      rule: "Host(`portal.platform.cbrains.de`)"
      entryPoints: [websecure]
      service: portal
      tls:
        certResolver: letsencrypt

    api:
      rule: "Host(`portal.platform.cbrains.de`) && PathPrefix(`/api`)"
      entryPoints: [websecure]
      service: api
      tls:
        certResolver: letsencrypt

    authentik:
      rule: "Host(`auth.platform.cbrains.de`)"
      entryPoints: [websecure]
      service: authentik
      tls:
        certResolver: letsencrypt

    mailcow:
      rule: "Host(`mail.mail.cbrains.de`)"
      entryPoints: [websecure]
      service: mailcow
      tls:
        certResolver: letsencrypt

  services:
    portal:
      loadBalancer:
        servers:
          - url: "http://portal:3000"

    api:
      loadBalancer:
        servers:
          - url: "http://api:3001"

    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"

    mailcow:
      loadBalancer:
        servers:
          - url: "http://nginx-mailcow:80"
